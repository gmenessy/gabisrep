<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Agentic Dossier</h1>
            <p>Air-gapped, privacy-first document analysis system</p>
        </header>

        <main>
            <section class="upload-section">
                <h2>Upload Documents</h2>
                <form id="upload-form">
                    <div class="file-input-wrapper">
                        <input type="file" id="pdf-upload" multiple accept=".pdf,.txt,.md">
                    </div>
                    <button type="submit" id="submit-btn">Ingest Documents</button>
                </form>
                <div id="status-message"></div>
            </section>
        </main>
    </div>

    <script src="cleandocs_pipeline.js"></script>
    <script src="app.js"></script>
</body>
</html>
