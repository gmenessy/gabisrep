<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Agentic Dossier - Document Ingestion</h1>

        <form id="upload-form">
            <div class="form-group">
                <label for="pdf-upload">Upload PDF Documents:</label>
                <input type="file" id="pdf-upload" multiple accept="application/pdf">
            </div>

            <button type="submit" id="submit-btn" class="btn">Ingest Documents</button>
        </form>

        <div id="results"></div>
    </div>

    <script src="cleandocs_pipeline.js"></script>
    <script src="app.js"></script>
</body>
</html>
