<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier</title>
    <link rel="stylesheet" href="style.css">
    <!-- Local font mapping for DM Sans would go here in a real deployment -->
</head>
<body>
    <header>
        <h1>Agentic Dossier</h1>
        <p>Privacy-first document analysis system</p>
    </header>

    <main>
        <section class="upload-section">
            <h2>Document Ingestion</h2>
            <form id="upload-form">
                <div class="file-input-wrapper">
                    <input type="file" id="pdf-upload" multiple accept=".pdf,.txt,.md">
                </div>
                <button type="submit" id="submit-btn">Upload and Process</button>
            </form>
            <div id="status-message"></div>
            <pre id="response-output"></pre>
        </section>
    </main>

    <script src="cleandocs_pipeline.js"></script>
    <script src="app.js"></script>
</body>
</html>
