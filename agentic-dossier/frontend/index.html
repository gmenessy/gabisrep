<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Embedding DM Sans font to avoid external CDN */
        @font-face {
            font-family: 'DM Sans';
            font-style: normal;
            font-weight: 400;
            src: local('DM Sans'), url('/fonts/DMSans-Regular.ttf') format('truetype');
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Agentic Dossier</h1>
        <form id="upload-form">
            <input type="file" id="pdf-upload" multiple>
            <button type="submit">Upload & Ingest</button>
        </form>
        <pre id="response-output"></pre>
    </div>
    <script src="app.js"></script>
    <script src="cleandocs_pipeline.js"></script>
</body>
</html>
