<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier - Document Ingestion</title>
    <!-- Use DM Sans Font -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Agentic Dossier</h1>
            <p>Upload your PDFs for local processing (CleanDocs v2).</p>
        </header>

        <main>
            <form id="upload-form">
                <div class="file-upload-wrapper">
                    <input type="file" id="pdf-upload" accept="application/pdf" multiple required>
                    <label for="pdf-upload" class="file-upload-label">Choose PDFs to Upload</label>
                    <span id="file-chosen">No files chosen</span>
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">Ingest Documents</button>
            </form>

            <div id="results" class="results-container">
                <!-- Status messages will appear here -->
            </div>
        </main>
    </div>

    <script src="cleandocs_pipeline.js"></script>
    <script src="app.js"></script>
</body>
</html>
