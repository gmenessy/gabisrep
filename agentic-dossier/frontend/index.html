<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Embedding DM Sans font to avoid external requests, keeping it local */
        @font-face {
            font-family: 'DM Sans';
            font-style: normal;
            font-weight: 400;
            src: local('DM Sans'), local('DMSans-Regular');
            /* Fallback to sans-serif if not found locally, we would typically download the woff2 file and serve it in a real air-gapped system. */
        }
    </style>
</head>
<body>
    <header>
        <h1>Agentic Dossier</h1>
        <p>Air-gapped, privacy-first document analysis system</p>
    </header>

    <main>
        <section id="upload-section">
            <h2>Upload Documents</h2>
            <form id="upload-form">
                <input type="file" id="pdf-upload" accept="application/pdf" multiple required>
                <button type="submit">Ingest Document</button>
            </form>
        </section>

        <section id="status-section">
            <h2>Status</h2>
            <div id="status-messages"></div>
        </section>
    </main>

    <script src="cleandocs_pipeline.js"></script>
    <script src="app.js"></script>
</body>
</html>
