<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Agentic Dossier - Document Ingestion</h1>
        <p>Upload your PDF documents for local processing.</p>

        <form id="upload-form">
            <div class="form-group">
                <input type="file" id="pdf-upload" multiple accept=".pdf">
            </div>
            <button type="submit" id="submit-btn">Upload and Process</button>
        </form>

        <div id="status-message"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
