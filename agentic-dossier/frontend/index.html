<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier - Document Ingestion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Agentic Dossier</h1>
        <p>Air-gapped privacy-first document analysis system.</p>

        <div class="upload-section">
            <label for="tenant-id">Tenant ID:</label>
            <input type="text" id="tenant-id" value="tenant-test-1" placeholder="Enter Tenant ID">
            <br><br>

            <input type="file" id="pdf-upload" multiple accept="application/pdf">
            <button id="upload-btn">Upload and Process</button>
        </div>

        <div id="results" class="results-section">
            <h2>Results</h2>
            <ul id="results-list"></ul>
        </div>
    </div>

    <!-- CleanDocs Pipeline script -->
    <script src="cleandocs_pipeline.js"></script>
    <!-- App script -->
    <script src="app.js"></script>
</body>
</html>
