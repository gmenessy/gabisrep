<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Agentic Dossier Ingestion</h1>
        <p>Upload your PDFs to securely ingest them into the isolated data environment.</p>

        <div>
            <input type="file" id="pdf-upload" multiple accept="application/pdf">
            <button id="upload-btn">Upload and Ingest</button>
        </div>

        <div id="output"></div>
    </div>

    <!-- The pipeline mock script MUST load before app.js since we use Vanilla JS without a bundler -->
    <script src="cleandocs_pipeline.js"></script>
    <script src="app.js"></script>
</body>
</html>
