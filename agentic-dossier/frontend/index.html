<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier - Ingestion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Agentic Dossier</h1>
            <p>Privacy-first document analysis system</p>
        </header>

        <main>
            <section class="upload-section">
                <h2>Upload Documents</h2>
                <div class="upload-box">
                    <input type="file" id="pdf-upload" multiple accept="application/pdf">
                    <button id="upload-btn" class="btn primary">Upload and Process</button>
                </div>
            </section>

            <section class="log-section">
                <h2>Activity Log</h2>
                <pre id="activity-log"></pre>
            </section>
        </main>
    </div>

    <!-- Scripts -->
    <script src="cleandocs_pipeline.js"></script>
    <script src="app.js"></script>
</body>
</html>
