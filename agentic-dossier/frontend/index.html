<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier - Document Ingestion</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Agentic Dossier</h1>
            <p>Upload your PDFs for local processing</p>
        </header>

        <main>
            <div class="upload-section">
                <input type="file" id="pdf-upload" accept="application/pdf" multiple>
                <button id="submit-btn" class="btn-primary">Process Documents</button>
            </div>

            <div id="status-container"></div>
        </main>
    </div>

    <script src="/cleandocs_pipeline.js"></script>
    <script src="/app.js"></script>
</body>
</html>
