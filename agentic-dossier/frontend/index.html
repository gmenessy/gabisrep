<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier</title>
    <link rel="stylesheet" href="style.css">
    <!-- Local font for DM Sans (mocked for air-gapped system) -->
    <!-- <link rel="stylesheet" href="fonts.css"> -->
</head>
<body>
    <div class="container">
        <header>
            <h1>Agentic Dossier</h1>
            <p>Privacy-first document analysis</p>
        </header>

        <main>
            <section class="upload-section">
                <h2>Upload Documents</h2>
                <div class="upload-controls">
                    <input type="file" id="pdf-upload" multiple accept=".pdf">
                    <button id="submit-btn" class="btn-primary">Ingest Documents</button>
                </div>
                <div id="status-container"></div>
            </section>
        </main>
    </div>

    <!-- Empty stub for pipeline -->
    <script src="cleandocs_pipeline.js"></script>
    <script src="app.js"></script>
</body>
</html>
