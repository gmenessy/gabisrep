<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic Dossier</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Embedded Local font logic for DM Sans as per requirements */
        @font-face {
            font-family: 'DM Sans';
            src: local('DM Sans'); /* We'll assume the local machine has the font for now to avoid CDNs */
        }
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #003A40; /* Midnight */
            color: #00B2A9; /* Lagoon */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.1);
        }
        button {
            background-color: #00965E; /* Basil */
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #007a4a;
        }
        .highlight {
            color: #F1C400; /* Amarillo */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="highlight">Agentic Dossier</h1>
        <p>Document Ingestion</p>
        <input type="file" id="pdf-upload" multiple>
        <button id="submit-btn">Upload</button>
        <div id="output" style="margin-top:20px;color:black;"></div>
    </div>

    <script src="cleandocs_pipeline.js"></script>
    <script src="app.js"></script>
</body>
</html>
