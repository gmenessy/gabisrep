version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
